<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 메이트</title>
<style>
  :root {
    --bg:#f3f5f9; --surface:#ffffff; --ink:#18212f; --mute:#64708a; --line:#e2e7f0;
    --brand:#1f4fd8; --brand-soft:#e8eefc; --brand-ink:#ffffff;
    --c-relax:#17915f; --c-normal:#1f4fd8; --c-busy:#d98a0b; --c-full:#d03a30; --c-none:#8a94a8;
    --c-relax-bg:#e3f5ec; --c-normal-bg:#e8eefc; --c-busy-bg:#fdf1dc; --c-full-bg:#fde7e5; --c-none-bg:#eef0f4;
    --shadow:0 1px 2px rgba(20,30,50,.06), 0 6px 20px rgba(20,30,50,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f141c; --surface:#171e29; --ink:#e9eef7; --mute:#93a0b8; --line:#263042;
      --brand:#7ea2ff; --brand-soft:#1d2a47; --brand-ink:#0b1020;
      --c-relax:#46c98c; --c-normal:#7ea2ff; --c-busy:#f0b04a; --c-full:#ff7a6e; --c-none:#8f9ab0;
      --c-relax-bg:#15301f; --c-normal-bg:#1d2a47; --c-busy-bg:#3a2b10; --c-full-bg:#3d1c1a; --c-none-bg:#222a38;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  svg.ic { width:1.15em; height:1.15em; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.2em; }

  /* top bar */
  header { background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .bar { max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:12px; }
  .logo { width:34px; height:34px; border-radius:10px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; }
  .logo svg { width:20px; height:20px; }
  .brand b { display:block; font-size:1.05rem; line-height:1.2; }
  .brand span { color:var(--mute); font-size:.78rem; }
  .spacer { flex:1; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:.78rem; background:var(--c-none-bg); color:var(--mute); }
  .pill i { width:8px; height:8px; border-radius:50%; background:var(--c-none); }
  .pill.live { background:var(--c-relax-bg); color:var(--c-relax); } .pill.live i { background:var(--c-relax); }
  .pill.demo { background:var(--c-busy-bg); color:var(--c-busy); } .pill.demo i { background:var(--c-busy); }

  /* layout */
  .wrap { max-width:1180px; margin:0 auto; padding:20px; display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; padding:16px; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .side { padding:18px; position:sticky; top:78px; }
  @media (max-width:900px) { .side { position:static; } }
  h2 { font-size:.8rem; letter-spacing:.04em; color:var(--mute); margin:0 0 10px; font-weight:700; }

  form.ask { display:flex; flex-direction:column; gap:10px; }
  textarea { width:100%; resize:none; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; min-height:84px; }
  textarea:focus { outline:2px solid var(--brand); border-color:transparent; }
  button.primary { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border:0; border-radius:12px; background:var(--brand); color:var(--brand-ink); font:inherit; font-weight:700; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:.82rem; cursor:pointer; }
  .chip:hover { background:var(--brand-soft); border-color:var(--brand); }

  .steps { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .steps li { display:flex; align-items:center; gap:10px; font-size:.86rem; padding:8px 10px; border-radius:10px; background:var(--bg); }
  .steps li.ok svg.ic { color:var(--c-relax); } .steps li.fail { color:var(--mute); } .steps li.fail svg.ic { color:var(--c-busy); }
  .steps small { color:var(--mute); margin-left:auto; }
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:.8rem; color:var(--mute); }
  .legend div { display:flex; align-items:center; gap:8px; }

  /* results */
  .empty { padding:48px 24px; text-align:center; color:var(--mute); }
  .empty .big { width:64px; height:64px; margin:0 auto 14px; border-radius:20px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; }
  .empty .big svg { width:34px; height:34px; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:640px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  .kpi { padding:14px; display:flex; flex-direction:column; gap:4px; }
  .kpi .lab { color:var(--mute); font-size:.76rem; display:flex; align-items:center; gap:6px; }
  .kpi .val { font-size:1.35rem; font-weight:800; display:flex; align-items:center; gap:8px; }
  .kpi .val svg.ic { width:1.5rem; height:1.5rem; }
  .brief { padding:16px 18px; margin-bottom:16px; display:flex; gap:12px; }
  .brief .ic { color:var(--brand); margin-top:3px; }

  .timeline { position:relative; display:flex; flex-direction:column; gap:16px; }
  .stop { display:grid; grid-template-columns:64px 1fr; gap:12px; }
  .when { text-align:center; position:relative; }
  .when b { display:inline-block; padding:4px 8px; border-radius:10px; background:var(--brand-soft); color:var(--brand); font-size:.9rem; }
  .when::after { content:""; position:absolute; left:50%; top:34px; bottom:-18px; width:2px; background:var(--line); transform:translateX(-50%); }
  .stop:last-child .when::after { display:none; }
  .card { overflow:hidden; display:grid; grid-template-columns:200px 1fr; }
  @media (max-width:640px) { .stop { grid-template-columns:1fr; } .when { text-align:left; } .when::after { display:none; } .card { grid-template-columns:1fr; } }
  .photo { position:relative; min-height:170px; background:var(--brand-soft); }
  .photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo .ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--brand); font-size:.78rem; }
  .photo .ph svg { width:44px; height:44px; stroke-width:1.4; }
  .tag { position:absolute; left:10px; top:10px; display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:99px; background:rgba(255,255,255,.92); color:#18212f; font-size:.76rem; font-weight:700; }
  .info { padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .info h3 { margin:0; font-size:1.08rem; }
  .why { color:var(--mute); font-size:.88rem; margin:0; }

  .crowd { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 10px; border-radius:12px; }
  .crowd .people { display:flex; gap:2px; }
  .crowd .people svg { width:20px; height:20px; stroke:none; }
  .crowd .lvl { font-weight:700; font-size:.86rem; }
  .crowd .nx { color:var(--mute); font-size:.78rem; margin-left:auto; display:flex; align-items:center; gap:4px; }
  .lv-1 { background:var(--c-relax-bg); color:var(--c-relax); } .lv-2 { background:var(--c-normal-bg); color:var(--c-normal); }
  .lv-3 { background:var(--c-busy-bg); color:var(--c-busy); } .lv-4 { background:var(--c-full-bg); color:var(--c-full); } .lv-0 { background:var(--c-none-bg); color:var(--c-none); }
  .note { color:var(--mute); font-size:.78rem; margin-top:12px; display:flex; gap:6px; align-items:flex-start; }
  .err { padding:20px; display:flex; gap:12px; color:var(--c-full); }
  .loading { padding:28px; display:flex; align-items:center; gap:12px; color:var(--mute); }
  .spin { width:20px; height:20px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 20h18M5 20V11l7-6 7 6v9M9 20v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5a4.75 4.75 0 0 1 .5 9.5H7z"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 5.5 4.75 4.75 0 0 1 17.5 15H7z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M4 6l16 12M20 6L4 18"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
    <symbol id="i-air" viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 22v-6M12 16c-4 0-6-2.5-6-5 0-1.6.9-3 2.2-3.7A4 4 0 0 1 12 2a4 4 0 0 1 3.8 5.3C17.1 8 18 9.400 18 11c0 2.500-2 5-6 5z"/></symbol>
    <symbol id="i-museum" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5M5 9v9M9.500 9v9M14.500 9v9M19 9v9M3 21h18M3 18h18"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 2 2v9M10 3v7a2 2 0 0 1-2 2M6 3v7M17 21V3c-2.200 1.500-3 4-3 7 0 2 1 3 3 3"/></symbol>
    <symbol id="i-festival" viewBox="0 0 24 24"><path d="M4 21l4-12 8 8-12 4zM14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 12l.7 1.300 1.300.7-1.300.7L19 16l-.7-1.300L17 14l1.300-.7z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="1.800"/><path d="M21 16l-5-5-8 8"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 17l.8 2.200L22 20l-2.200.8L19 23l-.8-2.200L16 20l2.200-.8z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L3 11l7 3 3 7zM10 14l11-11"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3.500" fill="currentColor"/><path d="M5 21v-3a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v3z" fill="currentColor"/></symbol>
  </defs>
</svg>

<header>
  <div class="bar">
    <div class="logo"><svg class="ic" style="width:20px;height:20px"><use href="#i-logo"/></svg></div>
    <div class="brand"><b>서울 메이트</b><span>실시간 날씨·붐빔 기반 나들이 코스</span></div>
    <div class="spacer"></div>
    <span id="mode" class="pill"><i></i><span>연결 확인 중</span></span>
  </div>
</header>

<div class="wrap">
  <aside class="panel side">
    <h2>무엇을 도와드릴까요?</h2>
    <form class="ask" id="form">
      <textarea id="q" maxlength="500" placeholder="예) 경복궁 근처 맛집 포함해서 코스 짜줘" required></textarea>
      <button class="primary" id="send"><svg class="ic"><use href="#i-send"/></svg>코스 만들기</button>
    </form>
    <div class="chips" id="chips"></div>

    <h2 style="margin-top:20px">확인 진행 상황</h2>
    <ul class="steps" id="steps"><li><svg class="ic"><use href="#i-clock"/></svg>질문을 기다리고 있어요</li></ul>

    <h2 style="margin-top:20px">혼잡도 보는 법</h2>
    <div class="legend" id="legend"></div>
  </aside>

  <main id="out" aria-live="polite">
    <div class="panel empty">
      <div class="big"><svg class="ic"><use href="#i-spark"/></svg></div>
      <b style="color:var(--ink)">오늘 서울 어디 갈까요?</b><br>
      날씨와 붐빔을 직접 확인한 뒤, 사진과 함께 시간순 코스를 보여 드려요.
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

// 서버에서 온 값은 항상 textContent로만 넣는다(HTML 주입 방지). 아이콘은 우리 코드의 고정 심볼만 쓴다.
function icon(name, cls) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ic' + (cls ? ' ' + cls : '')); const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#i-' + name); s.append(u); return s; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function safeUrl(u) { try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; } catch { return ''; } }

const TOOL = { get_weather:['sun','날씨'], get_crowd:['person','혼잡도'], list_places:['pin','장소 목록'], list_festivals:['festival','오늘 행사'] };
const CAT = { outdoor:['tree','야외'], indoor:['museum','실내'], food:['food','음식점'], festival:['festival','행사'] };
const LEVELS = [ ['여유',1,'붐비지 않아 여유로워요'], ['보통',2,'적당히 사람이 있어요'], ['약간 붐빔',3,'조금 붐벼요'], ['붐빔',4,'매우 붐벼요'] ];
function levelOf(c) { const f = LEVELS.find(l => l[0] === c); return f ? f[1] : 0; }

// 범례
for (const [name, n, desc] of LEVELS) { const d = el('div'); d.append(crowdIcons(n, true), el('span', null, name)); d.title = desc; $('legend').append(d); }
const nd = el('div'); nd.append(crowdIcons(0, true), el('span', null, '미확인')); $('legend').append(nd);

function crowdIcons(n, small) {
  const w = el('span', 'people lv-' + n); w.style.background = 'none';
  for (let i = 1; i <= 4; i++) { const p = icon('person'); if (i > n) p.style.opacity = '.22'; if (small) { p.style.width = '14px'; p.style.height = '14px'; } w.append(p); }
  return w;
}

// 날씨 아이콘/문구
function weatherView(w) {
  const p = String(w.precip || ''); const dry = !p || /없|none|^-$/.test(p);
  if (dry) return ['sun', '맑음·강수 없음']; if (/눈/.test(p)) return ['snow', p]; return ['rain', p];
}

// 상태 표시줄
fetch('/health').then(r => r.json()).then(h => {
  const m = $('mode'); m.className = 'pill ' + (h.mock_tools ? 'demo' : 'live');
  m.lastChild.textContent = h.mock_tools ? '샘플 데이터 모드' : '서울시 실시간 데이터';
}).catch(() => { $('mode').lastChild.textContent = '서버 연결 안 됨'; });

// 추천 질문
for (const t of ['오늘 서울 어디 갈까?', '비 와도 갈 만한 실내 코스', '경복궁 근처 맛집 포함해서 코스 짜줘', '사진 찍기 좋은 야외 위주로']) {
  const b = el('button', 'chip', t); b.type = 'button'; b.prepend(icon('spark')); b.onclick = () => { $('q').value = t; $('form').requestSubmit(); }; $('chips').append(b);
}

function renderCourse(course) {
  const out = $('out'); out.replaceChildren();
  const w = course.weather;
  const kp = el('div', 'kpis');
  const tile = (ic, lab, val) => { const k = el('div', 'panel kpi'); const l = el('div', 'lab'); l.append(icon(ic), lab); const v = el('div', 'val'); v.append(...val); k.append(l, v); return k; };
  if (w) {
    const [wi, wt] = weatherView(w);
    kp.append(tile('sun', '현재 기온', [icon(wi), document.createTextNode(w.temp_c != null ? Math.round(w.temp_c) + '°C' : '-')]),
              tile('drop', '강수', [document.createTextNode(wt.replace('맑음·', ''))]),
              tile('air', '미세먼지', [document.createTextNode(w.pm10_grade || '-')]));
  } else {
    kp.append(tile('sun', '날씨', [document.createTextNode('미확인')]));
  }
  kp.append(tile('pin', '추천 장소', [document.createTextNode(course.stops.length + '곳')]));
  const brief = el('div', 'panel brief'); brief.append(icon('spark'), el('div', null, course.summary));
  out.append(kp, brief);

  const tl = el('div', 'timeline');
  for (const s of course.stops) {
    const row = el('div', 'stop');
    const when = el('div', 'when'); when.append(el('b', null, s.time)); row.append(when);
    const card = el('div', 'panel card');
    const photo = el('div', 'photo'); const [ci, cl] = CAT[s.category] || ['pin', '장소'];
    const ph = el('div', 'ph'); ph.append(icon(CAT[s.category] ? ci : 'image'), el('span', null, '사진 준비 중'));
    photo.append(ph);
    const url = safeUrl(s.image);
    if (url) { const img = new Image(); img.alt = s.place; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onload = () => ph.remove(); img.onerror = () => img.remove(); img.src = url; photo.prepend(img); }
    const tag = el('span', 'tag'); tag.append(icon(ci), cl); photo.append(tag);
    const info = el('div', 'info');
    const h = el('h3'); h.append(icon('pin'), ' ', s.place);
    const n = levelOf(s.crowd), cr = el('div', 'crowd lv-' + n);
    cr.append(crowdIcons(n), el('span', 'lvl', s.crowd ? '현재 ' + s.crowd : '혼잡도 미확인'));
    if (s.crowd_next) { const nx = el('span', 'nx'); nx.append(icon('clock'), '다음 시간 예상 ' + s.crowd_next); cr.append(nx); }
    info.append(h, cr, el('p', 'why', s.reason));
    card.append(photo, info); row.append(card); tl.append(row);
  }
  out.append(tl);
  const note = el('div', 'note'); note.append(icon('clock'), '혼잡도·날씨는 조회 시점의 값이에요. 방문 시간대와 다를 수 있어요. 사진 출처: 한국관광공사.'); out.append(note);
}

function showMsg(text, cls, ic) { const d = el('div', 'panel ' + cls); d.append(icon(ic)); d.append(el('div', null, text)); $('out').replaceChildren(d); }

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('q').value.trim(); if (!text) return;
  $('send').disabled = true; $('steps').replaceChildren();
  const ld = el('div', 'panel loading'); ld.append(el('div', 'spin'), '날씨와 붐빔을 확인하고 있어요…'); $('out').replaceChildren(ld);
  try {
    const resp = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: text }) });
    if (!resp.ok) throw new Error(resp.status === 429 ? '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.' : '요청에 실패했어요.');
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /event: (\w+)/.exec(chunk)?.[1], data = JSON.parse(/data: (.*)/s.exec(chunk)[1]);
        if (ev === 'tool') {
          const [ti, tl] = TOOL[data.name] || ['spark', data.name];
          const target = data.input.place || data.input.area || data.input.keyword || data.input.district || '';
          const li = el('li', data.ok ? 'ok' : 'fail'); li.append(icon(data.ok ? 'check' : 'warn'), el('span', null, tl + (target ? ' · ' + target : '')), el('small', null, data.ok ? '완료' : '건너뜀'));
          $('steps').append(li);
        } else if (ev === 'result') {
          data.course ? renderCourse(data.course) : showMsg(data.answer, 'brief', 'spark');
        } else if (ev === 'error') showMsg(data.message, 'err', 'warn');
      }
    }
  } catch (err) { showMsg(err.message, 'err', 'warn'); }
  $('send').disabled = false;
});
</script>
