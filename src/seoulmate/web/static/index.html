<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서울 메이트 · 서울메이트</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='14' fill='%23C6E25A' stroke='%23111' stroke-width='5'/%3E%3Cg fill='%23111' stroke='%23111' stroke-width='2' stroke-linejoin='round'%3E%3Crect x='31' y='8' width='2' height='9'/%3E%3Cpath d='M23 24Q23 17 32 17Q41 17 41 24L39 29H25Z'/%3E%3Cpath d='M29 29H35L37 50H27Z'/%3E%3Cpath d='M22 50H42L46 57H18Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:#e9e9e6; --ink:#111111; --paper:#ffffff; --line:#d6d6d1; --mute:#66665f;
    --pink:#f28cb7; --sky:#8fc3ff; --lime:#c6e25a; --silver:#cfd1d4; --cream:#eeede6;
    --yellow:#FFE45C; --gray:#d9d9d5;
    --sh:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.08);
    --body:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --title:var(--body);
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; color:var(--ink); font:16px/1.6 var(--body); min-height:100vh; min-height:100dvh; background:var(--bg); }
  svg.ic { width:1.15em; height:1.15em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.2em; }

  /* ---------- header ---------- */
  header { position:sticky; top:0; z-index:10; background:var(--bg); }
  .bar { max-width:820px; margin:0 auto; padding:14px 16px 10px; display:flex; align-items:center; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:1.08rem; font-weight:800; letter-spacing:-.01em; }
  .logo-dot { width:40px; height:40px; border-radius:50%; background:var(--lime); display:grid; place-items:center; flex:none; }
  .logo-dot svg { width:15px; height:24px; }
  .spacer { flex:1; }
  .badge { display:inline-flex; align-items:center; gap:7px; padding:6px 12px; font-size:.85rem; font-weight:600; background:#dcdcd7; border-radius:99px; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:#a5a59e; flex:none; }
  .dot.ok { background:#36a35a; } .dot.bad { background:#e0457b; }

  /* ---------- 홈: 제목 + 메탈 자판기 ---------- */
  main { max-width:820px; margin:0 auto; padding:6px 16px 12px; }
  .fold { display:grid; grid-template-rows:1fr; transition:grid-template-rows .32s ease; }
  .stage.folded .fold { grid-template-rows:0fr; }
  .fold-in { min-height:0; overflow:hidden; padding:8px 16px 44px; margin:-8px -16px -40px; transition:padding .32s ease, margin .32s ease; }
  .stage.folded .fold-in { padding-top:0; padding-bottom:0; margin-top:0; margin-bottom:0; }
  .stage-grid { display:grid; gap:18px; }
  .hero h1 { margin:0; font-size:clamp(1.5rem, 6.2vw, 1.9rem); line-height:1.25; font-weight:800; letter-spacing:-.02em; text-wrap:balance; }
  .hero p { margin:6px 0 0; color:var(--mute); font-size:1rem; }
  @media (min-width:860px) {
    .stage-grid { grid-template-columns:1fr 400px; align-items:center; gap:36px; padding:10px 0 4px; }
    .hero h1 { font-size:1.8rem; }
    .hero p { font-size:1.1rem; }
  }
  .fold-bar { display:none; margin:0 0 12px; }
  .stage.has-chat .fold-bar { display:block; }
  .fold-toggle { display:inline-flex; align-items:center; gap:12px; padding:8px 16px; border:0; border-radius:99px; background:#161a17; color:#c5ef4a; font:700 12px/1 var(--mono); letter-spacing:.08em; }
  .fold-toggle .ftxt { color:#aab59a; font-family:var(--body); font-size:12px; letter-spacing:0; }

  /* 가챠 기계: 브러시드 실버 본체 / 초록 LCD / 유리창 / COIN · TURN · PICK UP */
  .machine { position:relative; width:min(100%, 380px); margin:0 auto; padding:14px 14px 12px; border-radius:26px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, rgba(255,255,255,.04) 1px 3px),
      linear-gradient(135deg, #f6f6f6 0%, #c9cacd 26%, #efeff0 50%, #bcbdc1 76%, #e6e6e8 100%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.85), inset 0 0 0 3px rgba(0,0,0,.1), 0 14px 28px rgba(0,0,0,.2), 0 2px 5px rgba(0,0,0,.25); }
  .screw { position:absolute; width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, #a9aaae 70%); box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  .screw::after { content:""; position:absolute; left:1px; right:1px; top:4px; height:1px; background:rgba(0,0,0,.45); transform:rotate(-30deg); }
  .screw.a { left:8px; top:8px; } .screw.b { right:8px; top:8px; } .screw.c { left:8px; bottom:8px; } .screw.d { right:8px; bottom:8px; }
  .lcd { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:12px; background:linear-gradient(#0c110e, #1a221d);
    box-shadow:inset 0 2px 7px #000, 0 0 0 2px #b4b5b9, 0 1px 0 2px #fff; }
  .lcd-main { font:800 clamp(19px, 6vw, 25px)/1 var(--mono); letter-spacing:.06em; color:#c5ef4a; text-shadow:0 0 9px rgba(197,239,74,.55); white-space:nowrap; }
  .lcd-sub { text-align:right; font:600 11px/1.35 var(--mono); color:#b7c3a6; white-space:nowrap; }
  .glass { position:relative; margin-top:12px; border-radius:16px; overflow:hidden; background:linear-gradient(160deg, #3a3e42, #15181a 55%, #24282b);
    box-shadow:inset 0 3px 12px rgba(0,0,0,.75), 0 0 0 2px #b4b5b9, 0 1px 0 2px #fff; }
  .glass svg { display:block; width:100%; height:auto; }
  .glass::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(112deg, rgba(255,255,255,.17) 0 16%, transparent 16% 24%, rgba(255,255,255,.08) 24% 28%, transparent 28%); }
  .cap { transform-box:fill-box; transform-origin:center; }
  .machine.shaking .cap { animation:jig .2s ease-in-out infinite alternate; animation-delay:var(--d, 0s); }
  @keyframes jig { from { transform:translate(-2px,1px) rotate(-7deg); } to { transform:translate(2px,-1.5px) rotate(7deg); } }

  .controls { display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:8px; align-items:end; margin-top:14px; padding:0 6px; }
  .ctl { display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0; }
  .ctl > span { font:700 10px/1 var(--mono); letter-spacing:.14em; color:#3b3b3e; }
  .coin { width:100%; max-width:62px; height:74px; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(#f7f7f7, #c3c4c8); box-shadow:inset 0 0 0 1px rgba(255,255,255,.9), 0 0 0 1px rgba(0,0,0,.18), 0 3px 5px rgba(0,0,0,.2); }
  .coin i { width:7px; height:38px; border-radius:4px; background:#0d0d0d; box-shadow:inset 0 1px 2px #000, 0 1px 0 rgba(255,255,255,.85); }
  .knob { position:relative; width:min(100%, 106px); aspect-ratio:1; padding:0; border:0; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle at 34% 28%, #fff 0%, #e2e2e4 30%, #a7a8ac 72%, #85868a 100%);
    box-shadow:inset 0 -5px 10px rgba(0,0,0,.2), 0 8px 14px rgba(0,0,0,.3), 0 0 0 4px rgba(255,255,255,.4); }
  .knob:active { transform:scale(.97); }
  .knob[aria-disabled="true"] { cursor:default; }
  .knob-face { position:absolute; inset:0; display:grid; place-items:center; }
  .knob-bar { position:relative; width:74%; height:21%; border-radius:99px; display:grid; place-items:center;
    background:linear-gradient(#fafafa, #bdbec2); box-shadow:inset 0 0 0 1px rgba(255,255,255,.9), 0 0 0 1px rgba(0,0,0,.16), 0 3px 5px rgba(0,0,0,.3); }
  .knob-bar i { width:34%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e6f58c, var(--lime) 60%, #96b53a); box-shadow:0 0 0 1px rgba(0,0,0,.2); }
  .knob.turning .knob-face { animation:knobSpin .8s linear infinite; }
  @keyframes knobSpin { to { transform:rotate(360deg); } }
  .tray-wrap { position:relative; width:100%; max-width:66px; }
  .tray-wrap::after { content:""; position:absolute; inset:-5px; border-radius:16px; border:2px solid var(--cap, var(--pink)); opacity:0; pointer-events:none; }
  .tray-wrap.has::after { animation:ring 1.5s ease-in-out .8s infinite; }
  @keyframes ring { 0%,100% { opacity:0; transform:scale(.96); } 50% { opacity:.9; transform:scale(1.06); } }
  .tray { position:relative; display:block; width:100%; height:74px; padding:0; border:0; border-radius:11px; overflow:hidden; background:linear-gradient(#25292c, #0b0c0d);
    box-shadow:inset 0 3px 8px #000, 0 0 0 2px #b0b1b5, 0 1px 0 2px #fff; }
  .tray::before { content:""; position:absolute; left:0; right:0; top:0; height:20px; background:linear-gradient(#a3a5a9, #3b3d40); }
  .tray:disabled { cursor:default; }
  .tray.has { cursor:pointer; }
  .pc { display:none; position:absolute; left:50%; bottom:7px; font-size:46px; width:1em; height:1em; margin-left:-.5em; border-radius:50%; transform:rotate(-14deg);
    background:linear-gradient(180deg, var(--cap, var(--pink)) 0 50%, var(--cream) 50% 100%);
    box-shadow:inset -.06em -.08em .12em rgba(0,0,0,.2), inset .04em .05em .08em rgba(255,255,255,.7), 0 .03em .06em rgba(0,0,0,.35); }
  .pc::after { content:""; position:absolute; left:.17em; top:.13em; width:.26em; height:.12em; border-radius:50%; background:rgba(255,255,255,.8); transform:rotate(-32deg); }
  .tray.has .pc { display:block; animation:dropIn .75s cubic-bezier(.3,.1,.5,1) both; }
  @keyframes dropIn {
    0% { transform:translateY(-120px) rotate(-40deg); }
    52% { transform:translateY(0) rotate(8deg); }
    70% { transform:translateY(-15px) rotate(-8deg); }
    86% { transform:translateY(0) rotate(2deg); }
    100% { transform:translateY(0) rotate(-14deg); } }
  .vend { margin:12px 0 0; text-align:center; font:600 9.5px/1 var(--mono); letter-spacing:.16em; color:#555559; }
  .mstatus { min-height:2em; margin:14px 0 0; text-align:center; font-size:.92rem; font-weight:600; color:var(--mute); }
  .g-msg { display:inline-block; padding:5px 14px; background:var(--paper); border:1px solid var(--pink); border-radius:99px; color:var(--ink); }

  /* ---------- chat ---------- */
  #log { display:flex; flex-direction:column; gap:18px; margin-top:6px; }
  .msg { display:flex; gap:10px; max-width:100%; }
  .msg.me { justify-content:flex-end; }
  .avatar { width:36px; height:36px; flex:none; border-radius:50%; background:var(--lime); display:grid; place-items:center; }
  .avatar svg { width:14px; height:22px; }
  .bubble { position:relative; padding:12px 16px; min-width:0; max-width:min(100%, 560px); overflow-wrap:anywhere; }
  .me .bubble { background:var(--ink); color:#fff; border-radius:20px 20px 6px 20px; font-weight:600; }
  .mate .bubble { background:var(--paper); border-radius:20px 20px 20px 6px; box-shadow:var(--sh); }
  .mate .bubble.wide { max-width:100%; flex:1; }
  .mate .name { font-weight:800; font-size:.92rem; margin-bottom:2px; }
  .mate-col { min-width:0; flex:1; }
  .msg.mate:not(.has-wide) .mate-col { flex:0 1 auto; }
  .mate-col.stack { display:flex; flex-direction:column; align-items:flex-start; gap:10px; flex:1; }

  .dots span { display:inline-block; animation:bounce 1s infinite; }
  .dots span:nth-child(2) { animation-delay:.15s; } .dots span:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-5px); } }

  /* ---------- result inside mate bubble ---------- */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px 0 12px; }
  @media (max-width:560px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  .kpi { background:var(--bg); padding:8px 10px; border-radius:12px; }
  .kpi .lab { font-size:.74rem; color:var(--mute); display:flex; gap:5px; align-items:center; }
  .kpi .val { font-weight:800; font-size:1.15rem; display:flex; gap:6px; align-items:center; }
  .brief { background:var(--bg); border-radius:12px; padding:10px 12px; margin-bottom:14px; display:flex; gap:8px; }
  .timeline { display:flex; flex-direction:column; gap:18px; }
  .stop { position:relative; background:var(--paper); border:1px solid var(--line); border-radius:16px; display:grid; grid-template-columns:170px 1fr; overflow:visible; }
  @media (max-width:560px) { .stop { grid-template-columns:1fr; } }
  .time { position:absolute; left:10px; top:-11px; z-index:2; padding:1px 11px; background:var(--ink); color:#fff; font-weight:700; font-size:.88rem; border-radius:99px; }
  .photo-wrap { display:flex; flex-direction:column; border-radius:15px 0 0 15px; overflow:hidden; background:#dfe8f3; }
  .photo { position:relative; flex:1; min-height:150px; overflow:hidden; }
  .credit { display:none; padding:2px 8px; font-size:.68rem; background:var(--paper); border-top:1px solid var(--line); }
  .photo-wrap.has-img .credit { display:block; }
  @media (max-width:560px) { .photo-wrap { border-radius:15px 15px 0 0; } .photo { min-height:140px; } }
  .photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo .ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:.8rem; color:var(--mute); }
  .photo .ph svg { width:38px; height:38px; }
  .tag { position:absolute; left:8px; bottom:8px; display:inline-flex; align-items:center; gap:5px; padding:2px 9px; background:var(--paper); border-radius:99px; font-size:.76rem; font-weight:700; }
  .info { padding:16px 14px 12px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .info h3 { margin:0; font-weight:800; font-size:1.1rem; }
  .why { margin:0; font-size:.92rem; }
  .crowd { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:5px 10px; border-radius:10px; }
  .crowd .people { display:flex; gap:1px; }
  .crowd .people svg { width:18px; height:18px; stroke:var(--ink); stroke-width:1.5; fill:var(--ink); }
  .crowd .lvl { font-weight:700; font-size:.88rem; }
  .crowd .nx { font-size:.78rem; margin-left:auto; display:flex; gap:4px; align-items:center; }
  .note { margin-top:12px; font-size:.78rem; color:var(--mute); display:flex; gap:6px; align-items:flex-start; }

  /* ---------- 가챠 팝업: 데스크톱은 가운데 모달, 모바일은 화면 전체를 덮는 바텀시트 (상태 클래스 이름이 서로 겹치지 않게 on / lid 로 구분) ---------- */
  body.noscroll { overflow:hidden; }
  .overlay { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(17,17,17,.5); }
  .overlay.on { display:flex; animation:fadeIn .2s ease both; }
  .dialog { position:relative; display:flex; flex-direction:column; width:min(100%, 440px); max-height:min(100%, 780px); background:var(--bg); border-radius:26px; box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden; animation:dlg .3s cubic-bezier(.2,1.1,.4,1) both; }
  .dialog:focus { outline:none; }
  @keyframes dlg { from { opacity:0; transform:translateY(24px) scale(.95); } to { opacity:1; transform:none; } }
  .dhead { display:flex; align-items:center; padding:14px 14px 0 20px; }
  .dhead h2 { margin:0; flex:1; font-size:1.2rem; font-weight:800; }
  .dhead h2 small { margin-left:8px; font:700 11px var(--mono); letter-spacing:.1em; color:var(--mute); }
  .xbtn { width:38px; height:38px; border:0; border-radius:50%; background:#dcdcd7; font-size:1rem; line-height:1; }
  .xbtn:disabled { opacity:.35; cursor:default; }
  .dbody { flex:1; overflow:auto; padding:0 18px 8px; text-align:center; }
  .dbody .sub { margin:0; font-size:.9rem; color:var(--mute); }

  /* 연출 무대: 한 칸(grid 1/1)에 캡슐·그림자·쪽지 카드를 겹쳐 둔다 → 카드가 길어지면 영역이 함께 늘어난다 */
  .play { display:grid; justify-items:center; min-height:300px; margin:4px auto 0; }
  .play > * { grid-area:1 / 1; }
  .floor { align-self:start; margin-top:262px; width:100px; height:14px; border-radius:50%; background:rgba(17,17,17,.22); filter:blur(3px); transition:opacity .3s; }
  .play .capsule { align-self:start; margin-top:144px; transition:opacity .3s, transform .3s; }
  .shaking .capsule { animation:rattle .5s ease-in-out infinite; }
  .lid .top { transform:translate(-18px,-42px) rotate(-24deg); }
  .slipOut .slip { animation:slipUp .36s cubic-bezier(.2,.9,.3,1) both; }
  .done .capsule { opacity:0; transform:translateY(18px) scale(.88); }
  .done .floor { opacity:0; }
  @keyframes rattle { 0%,100% { transform:translateX(0) rotate(0); } 15% { transform:translateX(-9px) rotate(-10deg); } 35% { transform:translateX(8px) rotate(9deg); } 55% { transform:translateX(-7px) rotate(-7deg); } 75% { transform:translateX(6px) rotate(6deg); } }
  @keyframes slipUp { from { opacity:0; transform:translateY(26px) rotate(-6deg); } 30% { opacity:1; } to { opacity:1; transform:translateY(-66px) rotate(5deg); } }

  /* 캡슐(팝업): em 기준 */
  .capsule { position:relative; font-size:120px; width:1em; height:1em; transform-origin:50% 100%; filter:drop-shadow(0 .04em .05em rgba(0,0,0,.3)); }
  .half { position:absolute; left:0; width:100%; height:.5em; }
  .top { top:0; border-radius:.5em .5em 0 0; background:var(--cap, var(--pink)); transform-origin:12% 100%; transition:transform .32s cubic-bezier(.3,1.5,.5,1); box-shadow:inset .04em .05em .08em rgba(255,255,255,.55); }
  .top::after { content:""; position:absolute; left:.14em; top:.09em; width:.25em; height:.11em; border-radius:50%; background:rgba(255,255,255,.8); transform:rotate(-30deg); }
  .bot { bottom:0; border-radius:0 0 .5em .5em; background:var(--cream); box-shadow:inset -.05em -.07em .1em rgba(0,0,0,.15); }
  .slip { position:absolute; left:50%; top:.2em; width:.28em; height:.37em; margin-left:-.14em; background:#fff; border:1px solid #cfcfca; border-radius:4px; opacity:0; z-index:-1; transform:translateY(24px) rotate(-6deg); }
  .slip::after { content:""; position:absolute; left:6px; right:6px; top:10px; height:2px; background:#c9c9c4; box-shadow:0 7px 0 #c9c9c4, 0 14px 0 #c9c9c4; }

  /* 펼쳐지는 쪽지 = 결과 카드 */
  .ticket { align-self:start; width:100%; text-align:left; background:var(--paper); border-radius:18px; box-shadow:var(--sh); overflow:hidden; opacity:0; pointer-events:none; transform-origin:50% 45%; }
  .showTicket .ticket { pointer-events:auto; animation:unfold .48s cubic-bezier(.2,.9,.3,1.08) both; }
  @keyframes unfold { from { opacity:0; transform:translateY(80px) scale(.16,.22); } 35% { opacity:1; } to { opacity:1; transform:none; } }
  .ticket .photo-wrap, .rcard .photo-wrap { border-radius:0; }
  .ticket .photo { min-height:120px; }
  .tbody { padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
  .tname { font-weight:800; font-size:1.12rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .phrase { align-self:flex-start; font-weight:800; font-size:1.6rem; line-height:1.25; background:linear-gradient(transparent 58%, var(--lime) 58%); padding:0 4px; }
  .cchips { display:flex; flex-wrap:wrap; gap:6px; }
  .cchip { padding:1px 11px; border-radius:99px; font-size:.84rem; font-weight:700; background:var(--bg); }
  .lv-1 { background:var(--lime); } .lv-2 { background:var(--sky); } .lv-3 { background:#f8c5d9; } .lv-4 { background:var(--pink); } .lv-0 { background:var(--gray); }
  .tnote { margin:0; font-size:.88rem; }
  .tnote b { font-weight:800; }
  .verify { font-size:.76rem; color:var(--mute); display:flex; gap:6px; align-items:center; }
  .phase { min-height:30px; margin:8px 0 0; font-weight:700; font-size:1.05rem; }

  .dfoot { padding:8px 18px 18px; display:flex; flex-direction:column; gap:10px; }
  .dfoot .row { display:flex; gap:10px; }
  .dfoot .row > * { flex:1; }
  .mbtn { padding:12px 10px; border:0; border-radius:99px; background:var(--paper); box-shadow:var(--sh); font-weight:700; font-size:1rem; line-height:1.15; }
  .mbtn.cta { background:var(--ink); color:#fff; font-size:1.1rem; padding:15px 10px; }
  .mbtn:active:not(:disabled) { transform:scale(.98); }
  .mbtn:disabled { background:var(--gray); color:var(--mute); box-shadow:none; cursor:default; }
  .g-left { display:flex; justify-content:center; align-items:center; gap:7px; font-size:.8rem; color:var(--mute); }
  .mini { width:20px; height:20px; border-radius:50%; background:linear-gradient(180deg, var(--pink) 50%, var(--cream) 50%); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:opacity .4s, transform .4s; }
  .mini.used { opacity:.25; transform:scale(.8); box-shadow:none; }

  /* 채팅으로 이어진 가챠 결과 카드 */
  .rcard { width:min(100%, 360px); background:var(--paper); border-radius:18px; box-shadow:var(--sh); overflow:hidden; animation:rise .4s cubic-bezier(.2,1.1,.4,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .rcard .photo { min-height:96px; }
  .rcard .tbody { padding:10px 12px 12px; gap:6px; }
  .rcard .phrase { font-size:1.3rem; }

  /* ---------- traffic light ---------- */
  .tl { position:relative; display:inline-flex; vertical-align:middle; padding:3px 4px; margin:0 2px; background:#2a2a2a; border:1px solid var(--ink); border-radius:99px; cursor:help; }
  .tl svg { width:12px; height:30px; display:block; }
  .tl .tip { display:none; position:absolute; left:0; top:calc(100% + 8px); z-index:20; width:max-content; max-width:min(240px, 70vw); padding:8px 12px; background:var(--ink); color:#fff; border-radius:12px; box-shadow:var(--sh); font:400 .82rem/1.45 var(--body); text-align:left; white-space:normal; }
  .tl .tip b { display:block; font-weight:700; }
  .tl:hover .tip, .tl:focus-visible .tip, .tl.open .tip { display:block; }
  .legend-box { background:var(--paper); border-radius:16px; box-shadow:var(--sh); margin:14px 0 18px; }
  .legend-box summary { cursor:pointer; padding:10px 16px; font-weight:700; font-size:.95rem; list-style:none; }
  .legend-box summary::-webkit-details-marker { display:none; }
  .legend-box summary::after { content:" ▾"; }
  .legend-box[open] summary::after { content:" ▴"; }
  .legend-box .rows { padding:2px 16px 12px; display:flex; flex-direction:column; gap:8px; }
  .legend-box .row { display:flex; gap:10px; align-items:center; font-size:.9rem; }
  .legend-box .row .tl { cursor:default; flex:none; }
  .legend-box .row b { display:block; }

  @media (prefers-reduced-motion:reduce) { .machine.shaking .cap, .knob.turning .knob-face, .tray.has .pc, .tray-wrap.has::after, .shaking .capsule, .slipOut .slip, .dialog, .rcard { animation:none !important; } .top, .capsule, .floor, .mini, .fold, .fold-in { transition:none !important; } .showTicket .ticket { animation:fadeIn .3s ease both; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @media (max-width:560px) {
    .overlay { padding:0; align-items:flex-end; }
    .dialog { width:100%; height:100%; max-height:none; border-radius:0; box-shadow:none; animation:sheet .34s cubic-bezier(.2,.9,.3,1) both; }
    @keyframes sheet { from { transform:translateY(100%); } to { transform:none; } }
    .dhead { padding-top:calc(14px + env(safe-area-inset-top)); }
    .dbody { display:flex; flex-direction:column; }
    .dbody .play { margin:auto; }
    .dfoot { padding:12px 18px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--paper); }
    .phrase { font-size:1.45rem; }
  }

  /* ---------- composer ---------- */
  .composer { position:sticky; bottom:0; z-index:9; background:var(--bg); padding:8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .composer-in { max-width:820px; margin:0 auto; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  form.ask { display:flex; gap:10px; align-items:center; }
  textarea { flex:1; resize:none; min-width:0; height:52px; padding:14px 20px; border:1px solid var(--line); border-radius:26px; background:var(--paper); color:var(--ink); font:inherit; font-size:16px; line-height:22px; overflow-y:auto; }
  textarea:focus { outline:2px solid var(--ink); outline-offset:1px; }
  textarea::placeholder { color:#8b8b85; }

  button { font:inherit; color:var(--ink); cursor:pointer; }
  button.primary { display:grid; place-items:center; flex:none; width:52px; height:52px; padding:0; border:0; border-radius:50%; background:var(--ink); color:#fff; font-size:1.2rem; }
  button.primary:active { transform:scale(.95); }
  button.primary:disabled { background:#b8b8b2; cursor:default; transform:none; }
  .chip { display:inline-flex; align-items:center; gap:6px; flex:none; padding:9px 16px; border:1px solid var(--line); border-radius:99px; background:var(--paper); box-shadow:0 1px 2px rgba(0,0,0,.05); font-size:.92rem; font-weight:600; }
  .chip:active { transform:scale(.97); }
  .chip:hover { border-color:var(--ink); }
  button:focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { .dots span { animation:none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tower" viewBox="0 0 40 80">
      <g fill="#111" stroke="#111" stroke-width="2" stroke-linejoin="round">
        <rect x="19" y="0" width="2" height="16"/>
        <path d="M9 24 Q9 15 20 15 Q31 15 31 24 L28 30 L12 30 Z"/>
        <path d="M16 30 L24 30 L26.5 66 L13.5 66 Z"/>
        <path d="M8 66 L32 66 L37 78 L3 78 Z"/>
      </g>
      <rect x="13" y="20" width="14" height="3" fill="#fff"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 5.5 4.75 4.75 0 0 1 17.5 15H7z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></symbol>

    <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 22v-6M12 16c-4 0-6-2.5-6-5 0-1.6.9-3 2.2-3.7A4 4 0 0 1 12 2a4 4 0 0 1 3.8 5.3C17.1 8 18 9.4 18 11c0 2.5-2 5-6 5z"/></symbol>
    <symbol id="i-museum" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 21h18M3 18h18"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 2 2v9M10 3v7a2 2 0 0 1-2 2M6 3v7M17 21V3c-2.2 1.5-3 4-3 7 0 2 1 3 3 3"/></symbol>
    <symbol id="i-festival" viewBox="0 0 24 24"><path d="M4 21l4-12 8 8-12 4zM14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 12l.7 1.3 1.3.7-1.3.7L19 16l-.7-1.3L17 14l1.3-.7z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="1.8"/><path d="M21 16l-5-5-8 8"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3.5"/><path d="M5 21v-3a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v3z"/></symbol>
  </defs>
</svg>

<header>
  <div class="bar">
    <div class="brand">
      <span class="logo-dot" aria-hidden="true"><svg viewBox="0 0 40 80"><use href="#tower"/></svg></span>
      <span>서울메이트</span>
    </div>
    <div class="spacer"></div>
    <span id="mode" class="badge" role="status" title="서버 연결 상태"><i id="mode-dot" class="dot"></i><span id="mode-txt">확인 중</span></span>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="fold-bar">
      <button class="fold-toggle" id="ftoggle" type="button" aria-expanded="true" aria-controls="fold-in"><span>SEOUL GACHA</span><span class="ftxt" id="ftxt">접기 ▴</span></button>
    </div>
    <div class="fold">
      <div class="fold-in" id="fold-in">
        <div class="stage-grid">
          <div class="hero">
            <h1>오늘 어디 갈지 말만 해.</h1>
            <p>아니면 손잡이 한 번 돌려봐.</p>
          </div>
          <div>
            <div class="machine" id="machine">
              <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>
              <div class="lcd"><span class="lcd-main">SEOUL GACHA</span><span class="lcd-sub">서울 가챠<br>NO.01</span></div>
              <div class="glass">
                <svg id="capfield" viewBox="0 0 300 172" role="img" aria-label="캡슐이 가득 든 유리창">
                  <defs>
                    <radialGradient id="capShade" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
                  </defs>
                </svg>
              </div>
              <div class="controls">
                <div class="ctl"><div class="coin" aria-hidden="true"><i></i></div><span>COIN</span></div>
                <div class="ctl"><button class="knob" id="turn" type="button" aria-label="TURN 손잡이를 돌려 캡슐 뽑기"><span class="knob-face"><span class="knob-bar"><i></i></span></span></button><span>TURN</span></div>
                <div class="ctl"><div class="tray-wrap" id="trayWrap"><button class="tray" id="pickup" type="button" aria-label="PICK UP 캡슐 열기" disabled><span class="pc"></span></button></div><span>PICK UP</span></div>
              </div>
              <p class="vend">SEOUL MATE VENDING · TODAY'S COURSE</p>
            </div>
            <p class="mstatus" id="mstatus" aria-live="polite"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <details class="legend-box">
    <summary>🚦 혼잡도 보는 법</summary>
    <div class="rows" id="legend"></div>
  </details>

  <div id="log" aria-live="polite"></div>
</main>

<div class="composer">
  <div class="composer-in">
    <div class="chips" id="chips"></div>
    <form class="ask" id="form">
      <textarea id="q" maxlength="500" rows="1" placeholder="어디 가고 싶어? 편하게 말해줘" required></textarea>
      <button class="primary" id="send" aria-label="보내기"><svg class="ic"><use href="#i-arrow"/></svg></button>
    </form>
  </div>
</div>

<!-- 가챠 팝업(모달 / 모바일 바텀시트). PICK UP 칸의 캡슐을 누르면 열리고, 캡슐이 열리며 결과 카드가 펼쳐진다. -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dtitle" tabindex="-1">
    <div class="dhead"><h2 id="dtitle">서울 가챠<small>NO.01</small></h2><button class="xbtn" id="xbtn" type="button" aria-label="닫기">✕</button></div>
    <div class="dbody">
      <p class="sub">오늘의 서울, 운명에 맡겨 볼래?</p>
      <div class="play" id="play">
        <div class="floor"></div>
        <div class="capsule" aria-hidden="true"><div class="slip"></div><div class="half bot"></div><div class="half top"></div></div>
        <article class="ticket" id="ticket"></article>
      </div>
      <p class="phase" id="phase" aria-live="polite"></p>
    </div>
    <div class="dfoot" id="dfoot"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

// 서버에서 온 값은 항상 textContent로만 넣는다(HTML 주입 방지). 아이콘은 우리 코드의 고정 심볼만 쓴다.
function icon(name, cls) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ic' + (cls ? ' ' + cls : '')); const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#i-' + name); s.append(u); return s; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

const CAT = { outdoor:['tree','야외'], indoor:['museum','실내'], food:['food','음식점'], festival:['festival','행사'] };
const LEVELS = ['여유', '보통', '약간 붐빔', '붐빔'];
function levelOf(c) { const i = LEVELS.indexOf(c); return i + 1; }

function towerAvatar() {
  const a = el('div', 'avatar'); const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 40 80');
  const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#tower'); s.append(u); a.append(s); return a;
}
function crowdIcons(n) {
  const w = el('span', 'people');
  for (let i = 1; i <= 4; i++) { const p = icon('person'); if (i > n) p.style.opacity = '.2'; w.append(p); }
  return w;
}
function weatherView(w) {
  const p = String(w.precip || ''); const dry = !p || /없|none|^-$/.test(p);
  if (dry) return ['sun', '맑음·강수 없음']; if (/눈/.test(p)) return ['snow', p]; return ['rain', p];
}

// ---------- 혼잡도 신호등 ----------
let MOCK = false;
// 4단계 혼잡도를 신호 3색으로: 여유=초록, 보통·약간 붐빔=노랑, 붐빔=빨강, 미확인=모두 꺼짐
const LAMP = { '여유':'g', '보통':'y', '약간 붐빔':'y', '붐빔':'r' };
const LAMP_COLOR = { r:'#FF5FA2', y:'#FFE45C', g:'#B9D65A' };
function lampSvg(level) {
  const on = LAMP[level], s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 12 30');
  [['r', 5], ['y', 15], ['g', 25]].forEach(([k, cy]) => {
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', 6); c.setAttribute('cy', cy); c.setAttribute('r', 4.2);
    c.setAttribute('fill', on === k ? LAMP_COLOR[k] : '#555'); c.setAttribute('stroke', on === k ? '#111' : '#3a3a3a'); c.setAttribute('stroke-width', on === k ? 1 : .5); s.append(c);
  });
  return s;
}
function trafficLight(level, next) {
  const b = el('button', 'tl'); b.type = 'button'; b.append(lampSvg(level));
  const tip = el('span', 'tip'); tip.append(el('b', null, '방금 확인한 실시간 정보'));
  tip.append(level ? '현재 ' + level : '혼잡도를 확인하지 못했어요');
  if (next) { tip.append(document.createElement('br'), '다음 시간 예상 ' + next); }
  if (MOCK) { tip.append(document.createElement('br'), '(샘플 데이터예요)'); }
  b.append(tip); b.setAttribute('aria-label', '혼잡도 신호등: ' + (level || '미확인'));
  b.addEventListener('click', (e) => { e.stopPropagation(); const was = b.classList.contains('open'); closeTips(); if (!was) b.classList.add('open'); });
  return b;
}
function closeTips() { document.querySelectorAll('.tl.open').forEach(x => x.classList.remove('open')); }
document.addEventListener('click', closeTips);

// 혼잡도 보는 법(신호등 설명)
for (const [lv, name, desc] of [
  ['여유', '여유', '사람이 적어서 편하게 둘러볼 수 있어요.'],
  ['보통', '보통 · 약간 붐빔', '적당히 사람이 있어요. 조금 붐비는 곳도 여기에 포함돼요.'],
  ['붐빔', '붐빔', '매우 붐벼요. 서울 가챠에서는 이런 곳을 빼고 뽑아요.'],
  ['', '미확인', '조회하지 못했어요. 지어내지 않고 확인 불가로 보여줘요.'],
]) {
  const row = el('div', 'row'); const t = el('span', 'tl'); t.append(lampSvg(lv));
  const d = el('div'); d.append(el('b', null, name), desc); row.append(t, d); $('legend').append(row);
}

// ---------- 연결 상태 배지 ----------
function setStatus(state, txt, tip) { $('mode-dot').className = 'dot ' + state; $('mode-txt').textContent = txt; $('mode').title = tip; }
fetch('/health').then(r => { if (!r.ok) throw 0; return r.json(); }).then(h => {
  MOCK = !!h.mock_tools;
  setStatus('ok', '연결됨', h.mock_tools ? '샘플 데이터 모드' : '서울시 실시간 데이터');
}).catch(() => setStatus('bad', '연결 안 됨', '서버에 연결할 수 없어요'));

// ---------- 채팅 ----------
const log = $('log');
function scrollDown() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
function addMe(text) { const m = el('div', 'msg me'); m.append(el('div', 'bubble', text)); log.append(m); scrollDown(); }
function addMate(wide) {
  const m = el('div', 'msg mate' + (wide ? ' has-wide' : '')); const col = el('div', 'mate-col');
  const b = el('div', 'bubble' + (wide ? ' wide' : '')); b.append(el('div', 'name', '서울메이트'));
  col.append(b); m.append(towerAvatar(), col); log.append(m); scrollDown();
  return { msg: m, bubble: b };
}
function say(bubble, text) { bubble.append(el('div', null, text)); }

// 예시 질문 칩
for (const t of ['비 와도 갈 데 있어?', '덜 붐비는 데이트 코스', '혼자 2시간 산책']) {
  const b = el('button', 'chip', t); b.type = 'button'; b.onclick = () => ask(t); $('chips').append(b);
}

// 장소 사진: 프론트는 외부 이미지를 직접 요청하지 않고 백엔드(/place-image)만 부른다. 없으면 플레이스홀더.
function placePhoto(name, category) {
  const wrap = el('div', 'photo-wrap'), photo = el('div', 'photo');
  const [ci, cl] = CAT[category] || ['pin', '장소'];
  const ph = el('div', 'ph'); ph.append(icon(CAT[category] ? ci : 'image'), el('span', null, '사진 준비 중')); photo.append(ph);
  const img = new Image(); img.alt = name; img.loading = 'lazy';
  img.onload = () => { ph.remove(); wrap.classList.add('has-img'); };
  img.onerror = () => img.remove();
  img.src = '/place-image?name=' + encodeURIComponent(name);
  photo.prepend(img);
  const tag = el('span', 'tag'); tag.append(icon(ci), cl); photo.append(tag);
  wrap.append(photo, el('div', 'credit', '사진: 한국관광공사'));
  return wrap;
}

function renderCourse(bubble, course) {
  const w = course.weather;
  const kp = el('div', 'kpis');
  const tile = (ic, lab, val) => { const k = el('div', 'kpi'); const l = el('div', 'lab'); l.append(icon(ic), lab); const v = el('div', 'val'); v.append(...val); k.append(l, v); return k; };
  if (w) {
    const [wi, wt] = weatherView(w);
    kp.append(tile('sun', '현재 기온', [icon(wi), document.createTextNode(w.temp_c != null ? Math.round(w.temp_c) + '°C' : '-')]),
              tile('drop', '강수', [document.createTextNode(wt.replace('맑음·', ''))]),
              tile('air', '미세먼지', [document.createTextNode(w.pm10_grade || '-')]));
  } else {
    kp.append(tile('sun', '날씨', [document.createTextNode('미확인')]));
  }
  kp.append(tile('pin', '추천 장소', [document.createTextNode(course.stops.length + '곳')]));
  const brief = el('div', 'brief'); brief.append(icon('spark'), el('div', null, course.summary));
  bubble.append(kp, brief);

  const tl = el('div', 'timeline');
  for (const s of course.stops) {
    const card = el('div', 'stop');
    card.append(el('span', 'time', s.time));
    const photo = placePhoto(s.place, s.category);
    const info = el('div', 'info');
    const h = el('h3'); h.append(icon('pin'), ' ', s.place, ' ', trafficLight(s.crowd, s.crowd_next));
    const n = levelOf(s.crowd), cr = el('div', 'crowd lv-' + (n > 0 ? n : 0));
    cr.append(crowdIcons(n > 0 ? n : 0), el('span', 'lvl', s.crowd ? '현재 ' + s.crowd : '혼잡도 미확인'));
    if (s.crowd_next) { const nx = el('span', 'nx'); nx.append(icon('clock'), '다음 시간 예상 ' + s.crowd_next); cr.append(nx); }
    info.append(h, cr, el('p', 'why', s.reason));
    card.append(photo, info); tl.append(card);
  }
  bubble.append(tl);
  const note = el('div', 'note'); note.append(icon('clock'), '혼잡도·날씨는 조회 시점의 값이야. 방문 시간대와 다를 수 있어. 사진 출처: 한국관광공사.');
  bubble.append(note);
}

// ---------- 서울 가챠 ----------
// 자판기: TURN 손잡이를 돌리면 날씨·혼잡도를 확인해 장소를 뽑고, 캡슐이 PICK UP 칸으로 떨어진다.
// 그 캡슐을 누르면 팝업이 열리며 뚜껑이 열리고 쪽지(결과 카드)가 펼쳐진다. 확인(날씨·혼잡도)이 끝난 장소만 나온다.
const MAX_SPINS = 3, drawn = [];
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHRASE = { SSR:'지금이 딱이야 🧡', SR:'가볼 만해 👍', R:'무난해 🙂' };  // 서버 등급 → 누구나 이해하는 문구
const PHASES = ['서울 하늘 보는 중… ☁️', '사람 얼마나 있는지 보는 중… 👥', '두구두구… 🥁'];
const PHASE_MIN = 420;  // 문구 하나를 최소 이만큼은 보여준다(도구가 빨리 끝나도 읽을 수 있게)
const SPIN_MIN = 1100;  // 손잡이는 최소 한 바퀴 넘게 돈다
const T = { pop:320, slip:360, unfold:480 };
const CAPS = ['var(--pink)', 'var(--sky)', 'var(--lime)'];
const play = $('play'), machine = $('machine'), knob = $('turn'), tray = $('pickup'), trayWrap = $('trayWrap'), mstatus = $('mstatus');
let gBusy = false, spinning = false, pending = false, lastPick = null, lastChecked = [], lastFocus = null, lastCap = CAPS[0];
function cls(...c) { play.className = 'play ' + c.join(' '); }
function lampEmoji(level) { return { '여유':'🟢', '보통':'🟡', '약간 붐빔':'🟡', '붐빔':'🔴' }[level] || '⚪'; }
function weatherChip(w) {
  const rain = w.precip && !/^(none|없음|-)$/i.test(String(w.precip));
  const t = w.temp_c != null ? Math.round(w.temp_c) + '° ' : '';
  return (rain ? (/눈/.test(w.precip) ? '❄️' : '🌧️') : '☀️') + ' ' + t + (rain ? w.precip : '맑음');
}

// 결과 카드(팝업 안 / 채팅방 공용). compact=true면 "왜 여기?"와 확인 문구를 뺀다.
function ticketNode(p, checked, compact) {
  const body = el('div', 'tbody');
  const name = el('div', 'tname'); name.append(p.place, trafficLight(p.crowd, p.crowd_next));
  const chips = el('div', 'cchips');
  chips.append(el('span', 'cchip', weatherChip(p.weather || {})), el('span', 'cchip lv-' + Math.max(0, levelOf(p.crowd)), lampEmoji(p.crowd) + ' ' + p.crowd));
  body.append(name, el('div', 'phrase', PHRASE[p.grade] || PHRASE.R), chips);
  if (!compact) {
    const why = el('p', 'tnote'); why.append(el('b', null, '왜 여기? '), p.reason);
    const ok = (n) => checked.some(c => c.name === n && c.ok);
    const v = el('div', 'verify'); v.append(icon('check'), ok('get_weather') && ok('get_crowd') ? '날씨·혼잡도 확인 완료' + (MOCK ? ' (샘플 데이터)' : '') : '확인 정보 없음');
    body.append(why, v);
  }
  const f = document.createDocumentFragment(); f.append(placePhoto(p.place, p.category), body); return f;
}

// ----- 팝업 열기/닫기: 포커스 이동·Esc·바깥 클릭·배경 스크롤 잠금 -----
function openModal() {
  lastFocus = document.activeElement; $('overlay').classList.add('on'); $('overlay').setAttribute('aria-hidden', 'false');
  document.body.classList.add('noscroll'); $('dialog').focus();
}
function closeModal() {
  if (gBusy) return;  // 캡슐이 열리는 동안에는 닫지 않는다
  $('overlay').classList.remove('on'); $('overlay').setAttribute('aria-hidden', 'true'); document.body.classList.remove('noscroll');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('xbtn').addEventListener('click', closeModal);
$('overlay').addEventListener('mousedown', (e) => { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (!$('overlay').classList.contains('on')) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Tab') {  // 포커스가 팝업 밖으로 나가지 않게
    const f = [...$('dialog').querySelectorAll('button:not(:disabled)')];
    if (!f.length) { e.preventDefault(); $('dialog').focus(); return; }
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === $('dialog'))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

function renderFoot(state) {
  const f = $('dfoot'); f.replaceChildren();
  const left = MAX_SPINS - drawn.length;
  const mk = (txt, cb, c2, dis) => { const b = el('button', 'mbtn ' + (c2 || ''), txt); b.type = 'button'; b.disabled = !!dis; if (cb) b.onclick = cb; return b; };
  if (state === 'busy') f.append(mk('뽑는 중…', null, 'cta', true));        // 캡슐이 열리는 동안엔 비활성 + "뽑는 중…"
  else {
    const again = mk(left <= 0 ? '오늘 캡슐은 끝!' : '한 번 더 🔄', () => { closeModal(); knob.focus(); turn(); }, '', left <= 0);
    f.append(mk('이걸로 코스 짜줘', useIt, 'cta', busy));  // 채팅이 진행 중이면 잠깐 비활성
    const row = el('div', 'row'); row.append(again, mk('닫기', closeModal)); f.append(row);
  }
  const l = el('div', 'g-left'); l.append(el('span', null, '남은 캡슐'));
  for (let i = 0; i < MAX_SPINS; i++) l.append(el('i', 'mini' + (i < drawn.length ? ' used' : '')));
  l.setAttribute('aria-label', '남은 캡슐 ' + left + '개'); f.append(l);
  $('xbtn').disabled = state === 'busy';
}

// ----- 자판기 화면 -----
// 유리창 안 캡슐: 위 반쪽만 분홍·하늘·라임·은색, 아래 반쪽은 크림색. 모양은 항상 같게(고정 시드).
function buildCapsules() {
  const svg = $('capfield'), mk = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const tops = ['var(--pink)', 'var(--sky)', 'var(--silver)', 'var(--lime)'];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const rows = [[58, 3, 104, 46], [86, 6, 35, 46], [114, 5, 58, 46], [142, 6, 35, 46]];  // [y, 개수, 첫 x, 간격]
  let n = 0;
  for (const [y, count, x0, dx] of rows.reverse()) for (let i = 0; i < count; i++, n++) {
    const g = mk('g', { transform: 'translate(' + (x0 + i * dx + (rnd() * 4 - 2)).toFixed(1) + ' ' + (y + (rnd() * 4 - 2)).toFixed(1) + ')' });
    const c = mk('g', { class: 'cap' }); c.style.setProperty('--d', '-' + (rnd() * .3).toFixed(2) + 's');
    const t = mk('g', { transform: 'rotate(' + Math.round(rnd() * 90 - 45) + ')' });
    const top = mk('path', { d: 'M-22 0A22 22 0 0 1 22 0Z' }); top.style.fill = tops[n % tops.length];
    const bot = mk('path', { d: 'M-22 0A22 22 0 0 0 22 0Z', fill: '#eceae2' });
    t.append(top, bot, mk('circle', { r: 22, fill: 'url(#capShade)' }), mk('ellipse', { cx: -8, cy: -11, rx: 6, ry: 3.2, fill: '#fff', opacity: .75, transform: 'rotate(-35 -8 -11)' }));
    c.append(t); g.append(c); svg.append(g);
  }
}
buildCapsules();

function machineSay(txt, err) { mstatus.replaceChildren(); if (err) mstatus.append(el('span', 'g-msg', txt)); else mstatus.textContent = txt; }
function idleText() { const left = MAX_SPINS - drawn.length; return left > 0 ? 'TURN을 돌려 뽑아봐 · 남은 캡슐 ' + left + '개' : '오늘 캡슐은 끝! 내일 또 만나자.'; }
function syncMachine() {
  knob.setAttribute('aria-disabled', String(spinning || gBusy || pending || drawn.length >= MAX_SPINS));
  tray.disabled = !pending || spinning || gBusy;
  tray.classList.toggle('has', pending); trayWrap.classList.toggle('has', pending);
}
function stopTurning() {   // 손잡이는 한 바퀴를 마저 돌고 멈춘다(중간에 툭 끊기지 않게)
  machine.classList.remove('shaking');
  if (!knob.classList.contains('turning')) return Promise.resolve();
  return new Promise((res) => {
    const done = () => { knob.classList.remove('turning'); res(); };
    knob.firstElementChild.addEventListener('animationiteration', done, { once:true }); setTimeout(done, 900);
  });
}

// /gacha/stream: 날씨·혼잡도 도구가 실제로 호출될 때마다 tool 이벤트가 오고, 마지막에 result가 온다.
async function readGachaStream(onTool) {
  const resp = await fetch('/gacha/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ exclude: drawn }) });
  if (!resp.ok) return { ok:false, message: resp.status === 429 ? '너무 빨리 돌렸어! 잠깐 쉬었다가 다시 해줘.' : '앗, 가챠 기계가 잠깐 멈췄어. 다시 돌려줘!' };
  const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', result = null;
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = /event: (\w+)/.exec(chunk)?.[1], data = JSON.parse(/data: (.*)/s.exec(chunk)[1]);
      if (ev === 'tool') onTool(data); else if (ev === 'result') result = data;
    }
  }
  return result || { ok:false, message:'앗, 가챠 기계가 잠깐 멈췄어. 다시 돌려줘!' };
}

// TURN: 손잡이가 돌고 캡슐들이 흔들리는 동안 결과를 뽑고, 끝나면 캡슐이 PICK UP 칸에 떨어진다.
async function turn() {
  if (spinning || gBusy) return;
  if (pending) { machineSay('PICK UP 칸의 캡슐을 먼저 열어봐! 👇'); return; }
  if (drawn.length >= MAX_SPINS) { machineSay(idleText()); return; }
  spinning = true; lastPick = null; syncMachine();
  const rm = reducedMotion(), t0 = Date.now();
  let phaseAt = Date.now(), chain = Promise.resolve(), crowdShown = false;
  const show = (n) => { machineSay(PHASES[n]); phaseAt = Date.now(); };
  const goPhase = (n) => (chain = chain.then(async () => { const w = PHASE_MIN - (Date.now() - phaseAt); if (w > 0) await sleep(w); show(n); }));
  show(0); if (!rm) { machine.classList.add('shaking'); knob.classList.add('turning'); }
  let data;
  try {
    data = await readGachaStream((d) => { if (d.name === 'get_crowd' && !crowdShown) { crowdShown = true; goPhase(1); } });
  } catch { data = { ok:false, message:'앗, 가챠 기계에 연결이 안 돼. 다시 돌려줘!' }; }

  if (data.ok && data.pick) {
    if (!crowdShown) goPhase(1);
    await goPhase(2);                                   // 두구두구
    const wait = SPIN_MIN - (Date.now() - t0); if (!rm && wait > 0) await sleep(wait);
    await stopTurning();
    lastPick = data.pick; lastChecked = data.checked || []; drawn.push(lastPick.place);
    lastCap = CAPS[Math.floor(Math.random() * CAPS.length)]; trayWrap.style.setProperty('--cap', lastCap); tray.style.setProperty('--cap', lastCap);
    pending = true; machineSay('캡슐이 나왔어! 눌러서 열어봐 👆');
  } else {
    await chain; await stopTurning();
    machineSay(data.message || '이번엔 못 뽑았어. 다시 돌려줘!', true);
  }
  spinning = false; syncMachine();
}

// PICK UP 칸의 캡슐을 누르면 팝업이 열리고, 캡슐이 덜컹 → 뚜껑이 열림 → 쪽지가 올라와 펼쳐지며 결과가 나온다.
async function openCapsule() {
  if (!pending || spinning || gBusy) return;
  pending = false; gBusy = true; syncMachine();
  play.style.setProperty('--cap', lastCap);
  $('ticket').replaceChildren(ticketNode(lastPick, lastChecked, false));
  cls(); $('phase').textContent = ''; renderFoot('busy'); openModal();
  if (reducedMotion()) { cls('done', 'showTicket'); await sleep(300); }   // 모션 줄이기: 흔들림 없이 카드만 부드럽게
  else {
    await sleep(260); cls('shaking'); await sleep(520);
    cls('lid'); await sleep(T.pop);
    cls('lid', 'slipOut'); await sleep(T.slip);
    cls('lid', 'slipOut', 'done', 'showTicket'); await sleep(T.unfold);
  }
  $('phase').textContent = '짠! 오늘의 한 곳이야';
  gBusy = false; renderFoot('result'); syncMachine(); machineSay(idleText());
}
knob.addEventListener('click', turn);
tray.addEventListener('click', openCapsule);
machineSay(idleText()); syncMachine();

// 채팅이 시작되면 홈(제목 + 기계)은 위로 접히고, 위쪽 막대로 다시 펼칠 수 있다.
const stage = $('stage'), ftoggle = $('ftoggle');
function setFolded(f) {
  stage.classList.toggle('folded', f); $('fold-in').inert = f; $('fold-in').setAttribute('aria-hidden', String(f));
  ftoggle.setAttribute('aria-expanded', String(!f)); $('ftxt').textContent = f ? '펼치기 ▾' : '접기 ▴';
}
ftoggle.addEventListener('click', () => setFolded(!stage.classList.contains('folded')));
function chatStarted() { if (!stage.classList.contains('has-chat')) { stage.classList.add('has-chat'); setFolded(true); } }

// [이걸로 코스 짜줘] → 팝업을 닫고 결과를 채팅방 카드 메시지로 넣은 뒤, 같은 장소로 대화를 이어간다(날씨·혼잡도 재확인).
function useIt() {
  if (!lastPick || busy) return;
  const p = lastPick, checked = lastChecked; closeModal();
  const m = addMate(false); m.bubble.append(el('div', null, '가챠 결과야! 🎰'));
  const rc = el('div', 'rcard'); rc.append(ticketNode(p, checked, true)); m.bubble.parentElement.append(rc);
  m.msg.classList.add('has-wide'); m.bubble.parentElement.classList.add('stack'); scrollDown();
  ask(p.place + ' 포함해서 코스 짜줘');
}

let busy = false;
async function ask(text) {
  text = text.trim(); if (!text || busy) return;
  busy = true; $('send').disabled = true; $('q').value = '';
  chatStarted();
  addMe(text);
  const { msg, bubble } = addMate(false);
  const wait = el('div', 'dots'); wait.append('날씨랑 붐빔 확인하는 중', ...[1,2,3].map(() => el('span', null, '.')));
  bubble.append(wait);  // 확인 중에는 한 줄 상태만 보여준다(도구별 진행 내역은 숨김)
  try {
    const resp = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: text }) });
    if (!resp.ok) throw new Error(resp.status === 429 ? '요청이 너무 많아! 잠깐 쉬었다가 다시 해줘.' : '앗, 요청에 실패했어.');
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /event: (\w+)/.exec(chunk)?.[1], data = JSON.parse(/data: (.*)/s.exec(chunk)[1]);
        if (ev === 'result') {
          wait.remove();
          if (data.course) { msg.classList.add('has-wide'); bubble.classList.add('wide'); renderCourse(bubble, data.course); }
          else say(bubble, data.answer);
        } else if (ev === 'error') { wait.remove(); say(bubble, data.message); }
      }
    }
  } catch (err) { wait.remove(); say(bubble, err.message); }
  busy = false; $('send').disabled = false; scrollDown();
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); ask($('q').value); });
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); } });
</script>
